<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Elijah Alexander" />
    <meta
      name="description"
      content="A flashcard site where fun and learning of software engineering is created"
    />
    <meta name="keywords" content="Flashcards,software engineering, learning, fun, education" />
    <title>TechFun FlashCards</title>
    <link rel="icon" href="./favicon.ico" type="image/icon" />
    <link rel="stylesheet" href="./assets/css/index.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="page">
    <header class="header">
      <h1 class="header__title">
        <a href="#home" class="header__link">Flash Cards</a>
      </h1>
      <nav class="nav">
        <ul class="nav__links">
          <li><a href="#home" class="nav__link">My Decks</a></li>
          <li><a href="#about" class="nav__link">About</a></li>
        </ul>
      </nav>
    </header>
    <main class="page__main-content">
      <section id="home" class="gallery">
        <h2 class="gallery__title">My Decks</h2>
        <div class="gallery__row">
          <ul class="gallery__list">
            <template id="deck-template">
              <li class="card">
                <a href="#" class="card__link"></a>
                <h3 class="card__title"></h3>
                <div class="card__row">
                  <p class="card__count"></p>
                  <button
                    type="button"
                    aria-label="Delete this card"
                    class="card__btn card__btn_type_delete"
                  ></button>
                </div>
              </li>
            </template>
          </ul>
          <button type="button" aria-label="Create a card" class="gallery__new-card-btn">
            + New Deck
          </button>
        </div>
      </section>
      <section id="deck-view" class="gallery">
        <div class="gallery__wrapping-row">
          <h2 class="gallery__title"></h2>
          <button class="gallery__practice__btn">Practice</button>
        </div>
        <div class="gallery__row">
          <ul class="gallery__list">
            <template id="card-template">
              <li class="card">
                <h3 class="card__title"></h3>
                <div class="card__row">
                  <button
                    type="button"
                    aria-label="flip this card"
                    class="card__btn card__btn_type_flip"
                  ></button>
                  <button
                    type="button"
                    aria-label="Delete this card"
                    class="card__btn card__btn_type_delete"
                  ></button>
                </div>
              </li>
            </template>
          </ul>
          <button
            type="button"
            aria-label="Create a card"
            class="gallery__new-card-btn gallery__new-card-btn_location_deck-view"
          >
            + New Card
          </button>
        </div>
      </section>
      <section id="carousel" class="carousel">
        <h2 class="carousel__title">HTML Tags Deck &middot; 1/10</h2>
        <div class="carousel__grid">
          <button
            type="button"
            aria-label="previous card"
            class="carousel__btn carousel__btn_type_left carousel__btn_disabled"
          ></button>
          <div class="carousel__card carousel__card_color_green">
            <p class="carousel__card-text">&lt;body&gt;&lt;/body&gt;</p>
          </div>
          <button
            type="button"
            aria-label="next card"
            class="carousel__btn carousel__btn_type_right"
          ></button>
          <button
            type="button"
            aria-label="flip card"
            class="carousel__btn carousel__btn_type_flip"
          ></button>
        </div>
      </section>
    </main>
    <section id="not-found" class="not-found">
      <h2 class="not-found__status-code">404</h2>
      <p class="not-found__text">Sorry, nothing found!</p>
    </section>
    <footer class="footer">
      <p class="footer__text">&copy;2026 Elijah Alexander</p>
    </footer>
    <script type="module" src="./assets/js/index.js"></script>
  </body>
</html>
